<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger 55 CCS | Menú Interactivo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0c0d0e;
            --bg-surface: #141619;
            --bg-card: #1b1e22;
            --accent-fire: #ff4d00;
            --accent-fire-glow: rgba(255, 77, 0, 0.35);
            --accent-gold: #ffb800;
            --text-high: #f8fafc;
            --text-muted: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --whatsapp-color: #25d366;
            --radius-card: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-high);
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* TICKER BCV */
        .live-ticker {
            background: linear-gradient(90deg, #180900, #240e00, #180900);
            border-bottom: 1px solid rgba(255, 77, 0, 0.25);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82em;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
        }

        .ticker-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .rate-badge {
            background: var(--accent-fire);
            color: #fff;
            padding: 3px 10px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.9em;
            box-shadow: 0 2px 10px var(--accent-fire-glow);
        }

        /* HEADER */
        header {
            padding: 35px 24px 15px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .brand-badge {
            display: inline-block;
            font-size: 0.75em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            background: rgba(255, 184, 0, 0.1);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 184, 0, 0.2);
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: clamp(2.4em, 8vw, 3.8em);
            font-weight: 900;
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 40%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 span {
            color: var(--accent-fire);
            -webkit-text-fill-color: var(--accent-fire);
        }

        .brand-tagline {
            color: var(--text-muted);
            font-size: 0.95em;
            max-width: 440px;
            margin: 0 auto 15px;
            line-height: 1.5;
        }

        /* MODALIDAD ENTREGA */
        .order-type-selector {
            display: inline-flex;
            background: var(--bg-surface);
            padding: 4px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
            margin-bottom: 15px;
        }

        .type-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 0.85em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .type-btn.active {
            background: var(--accent-fire);
            color: #fff;
        }

        /* FILTROS */
        .filter-scroller {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 20px 20px;
            justify-content: center;
            scrollbar-width: none;
        }
        .filter-scroller::-webkit-scrollbar { display: none; }

        .filter-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.85em;
            font-weight: 700;
            padding: 9px 18px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-fire);
            color: #fff;
            border-color: var(--accent-fire);
            box-shadow: 0 4px 18px var(--accent-fire-glow);
        }

        /* MENU GRID */
        .menu-container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 24px;
        }

        .food-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .food-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 77, 0, 0.4);
        }

        .food-img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 11;
            background: #1e2227;
            overflow: hidden;
            cursor: pointer;
        }

        .food-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .food-card:hover .food-img-wrapper img {
            transform: scale(1.05);
        }

        .tag-promo {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(12, 13, 14, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--accent-gold);
            font-size: 0.72em;
            font-weight: 800;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 999px;
            letter-spacing: 0.5px;
        }

        .food-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .food-title {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 1.35em;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }

        .food-desc {
            font-size: 0.85em;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 16px;
            flex-grow: 1;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-subtle);
        }

        .usd-val {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 1.5em;
            font-weight: 900;
            color: var(--accent-gold);
        }

        .bs-val {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-muted);
        }

        .add-cart-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: #fff;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9em;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .add-cart-btn:hover {
            background: var(--accent-fire);
            border-color: var(--accent-fire);
            box-shadow: 0 4px 14px var(--accent-fire-glow);
        }

        /* BARRA FLOTANTE */
        .cart-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(140%);
            width: calc(100% - 32px);
            max-width: 520px;
            background: rgba(20, 22, 25, 0.95);
            border: 1px solid rgba(255, 77, 0, 0.4);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px var(--accent-fire-glow);
            padding: 14px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cart-bar.active {
            transform: translateX(-50%) translateY(0);
        }

        .cart-info {
            display: flex;
            flex-direction: column;
        }

        .cart-badge {
            font-size: 0.75em;
            font-weight: 800;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .cart-total-box {
            font-size: 1.15em;
            font-weight: 900;
            color: #fff;
        }

        .cart-total-box small {
            font-size: 0.75em;
            color: var(--text-muted);
            margin-left: 6px;
            font-weight: 600;
        }

        .btn-open-drawer {
            background: var(--accent-fire);
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* MODAL / DRAWER DEL PEDIDO */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            justify-content: flex-end;
        }

        .drawer-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer-sheet {
            background: var(--bg-surface);
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            border-left: 1px solid var(--border-subtle);
            padding: 24px;
        }

        .drawer-overlay.active .drawer-sheet {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .drawer-header h3 {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 1.5em;
            font-weight: 900;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: #fff;
            width: 34px; height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1em;
        }

        .cart-items-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
        }

        .item-row-info h4 {
            font-size: 0.95em;
            font-weight: 700;
        }

        .item-row-info small {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 28px; height: 28px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
        }

        .drawer-footer {
            padding-top: 18px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .drawer-total-box {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .drawer-total-box span {
            color: var(--text-muted);
            font-weight: 600;
        }

        .drawer-total-box strong {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 1.6em;
            color: var(--accent-gold);
        }

        .wa-send-btn {
            background: var(--whatsapp-color);
            color: #fff;
            padding: 15px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.35);
        }

        .wa-send-btn svg {
            width: 22px; height: 22px;
            fill: #fff;
        }
    </style>
</head>
<body>

<!-- TICKER BCV -->
<div class="live-ticker">
    <div class="ticker-pill">
        <span class="status-dot"></span>
        <span>BCV En Vivo</span>
    </div>
    <div class="rate-badge" id="bcv-text">Consultando...</div>
</div>

<!-- HEADER BURGER 55 -->
<header>
    <div class="brand-badge">Caracas • Sabores al Fuego</div>
    <h1>BURGER <span>55</span></h1>
    <p class="brand-tagline">Smash burgers artesanales, pan brioche de autor y combos directos a tu puerta.</p>
    
    <div class="order-type-selector">
        <button class="type-btn active" onclick="cambiarTipoOrden('Delivery', this)">🛵 Delivery</button>
        <button class="type-btn" onclick="cambiarTipoOrden('Pickup / Retiro', this)">🏪 Retiro en Local</button>
    </div>
</header>

<!-- CATEGORÍAS -->
<div class="filter-scroller">
    <button class="filter-btn active" onclick="filtrarMenu('todos', this)">🔥 Todo</button>
    <button class="filter-btn" onclick="filtrarMenu('smash', this)">Burgers</button>
    <button class="filter-btn" onclick="filtrarMenu('combos', this)">Combos</button>
    <button class="filter-btn" onclick="filtrarMenu('sides', this)">Sides & Papas</button>
</div>

<!-- GRILLA PRODUCTOS -->
<main class="menu-container" id="menu-grid"></main>

<!-- BARRA FLOTANTE -->
<div class="cart-bar" id="cart-bar" onclick="abrirDrawer()">
    <div class="cart-info">
        <span class="cart-badge" id="cart-count">0 ítems</span>
        <div class="cart-total-box">
            <span id="cart-usd">$0.00</span>
            <small id="cart-bs">(0.00 Bs)</small>
        </div>
    </div>
    <div class="btn-open-drawer">
        <span>Ver Comanda</span>
        <span>→</span>
    </div>
</div>

<!-- DRAWER / RESUMEN DE LA COMANDA -->
<div class="drawer-overlay" id="drawer-overlay" onclick="if(event.target === this) cerrarDrawer()">
    <div class="drawer-sheet">
        <div class="drawer-header">
            <h3>Tu Comanda</h3>
            <button class="close-btn" onclick="cerrarDrawer()">✕</button>
        </div>

        <div class="cart-items-list" id="cart-items-list">
            <!-- Ítems agregados dinámicamente -->
        </div>

        <div class="drawer-footer">
            <div class="drawer-total-box">
                <span>Total a pagar:</span>
                <div>
                    <strong id="drawer-total-usd">$0.00</strong>
                    <div style="font-size: 0.85em; color: var(--text-muted); text-align: right;" id="drawer-total-bs">0.00 Bs</div>
                </div>
            </div>
            <a href="#" id="wa-checkout-link" target="_blank" class="wa-send-btn">
                <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                <span>Enviar Pedido a WhatsApp</span>
            </a>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        telefonoWA: "584241234567",
        tasaBackup: 866.56
    };

    let tasaOficial = CONFIG.tasaBackup;
    let tipoEntrega = "Delivery";
    let carrito = {};

    const MENU = [
        {
            id: "b55-classic",
            nombre: "55 Original Smash",
            categoria: "smash",
            tag: "Más Pedida",
            precioUSD: 8.50,
            desc: "Doble carne smashed de 90g con costra crocante, doble cheddar fundido, pepinillos y salsa 55 en pan brioche.",
            img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&auto=format&fit=crop&q=80"
        },
        {
            id: "b55-truffle",
            nombre: "Smoked Bacon Melt",
            categoria: "smash",
            tag: "Especial",
            precioUSD: 11.00,
            desc: "Doble carne, mermelada de tocineta ahumada artesanal, cebolla crispy y salsa BBQ especial de la casa.",
            img: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=600&auto=format&fit=crop&q=80"
        },
        {
            id: "b55-combo-duo",
            nombre: "Combo Dúo Brutal",
            categoria: "combos",
            tag: "Ahorro",
            precioUSD: 19.50,
            desc: "2x 55 Original Smash + Ración generosa de papas rústicas + 2 refrescos de lata bien fríos.",
            img: "https://images.unsplash.com/photo-1610440042657-612c34d95e9f?w=600&auto=format&fit=crop&q=80"
        },
        {
            id: "b55-fries-loaded",
            nombre: "Papas 55 Loaded",
            categoria: "sides",
            tag: "Para compartir",
            precioUSD: 6.00,
            desc: "Papas fritas rústicas con queso cheddar líquido caliente, tocineta crocante y cebollín fresco.",
            img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=600&auto=format&fit=crop&q=80"
        }
    ];

    document.addEventListener("DOMContentLoaded", async () => {
        await sincronizarTasaBCV();
        renderizarCards('todos');
    });

    async function sincronizarTasaBCV() {
        const badge = document.getElementById("bcv-text");
        try {
            const res = await fetch("https://ve.dolarapi.com/v1/dolares/oficial");
            if (res.ok) {
                const data = await res.json();
                if (data && data.promedio) {
                    tasaOficial = data.promedio;
                }
            }
        } catch (e) {
            console.warn("Tasa backup activa");
        }
        badge.textContent = `Bs. ${tasaOficial.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function renderizarCards(categoria) {
        const grid = document.getElementById("menu-grid");
        grid.innerHTML = "";

        const items = categoria === 'todos' ? MENU : MENU.filter(i => i.categoria === categoria);

        items.forEach(p => {
            const bsPrecio = (p.precioUSD * tasaOficial).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const card = document.createElement("article");
            card.className = "food-card";
            card.innerHTML = `
                <div class="food-img-wrapper" onclick="agregarItem('${p.id}')">
                    <span class="tag-promo">${p.tag}</span>
                    <img src="${p.img}" alt="${p.nombre}" loading="lazy">
                </div>
                <div class="food-content">
                    <h3 class="food-title">${p.nombre}</h3>
                    <p class="food-desc">${p.desc}</p>
                    <div class="price-row">
                        <div class="usd-val">$${p.precioUSD.toFixed(2)}</div>
                        <div class="bs-val">Bs. ${bsPrecio}</div>
                    </div>
                    <button class="add-cart-btn" onclick="agregarItem('${p.id}')">
                        <span>+ Agregar a la orden</span>
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filtrarMenu(categoria, btn) {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderizarCards(categoria);
    }

    function cambiarTipoOrden(tipo, btn) {
        tipoEntrega = tipo;
        document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        actualizarDrawerYMensaje();
    }

    function agregarItem(id) {
        if (!carrito[id]) {
            const prod = MENU.find(m => m.id === id);
            carrito[id] = { ...prod, cantidad: 1 };
        } else {
            carrito[id].cantidad += 1;
        }
        actualizarDrawerYMensaje();
    }

    function modificarCantidad(id, delta) {
        if (!carrito[id]) return;
        carrito[id].cantidad += delta;
        if (carrito[id].cantidad <= 0) {
            delete carrito[id];
        }
        actualizarDrawerYMensaje();
    }

    function actualizarDrawerYMensaje() {
        const bar = document.getElementById("cart-bar");
        const list = document.getElementById("cart-items-list");
        const countEl = document.getElementById("cart-count");
        const cartUsd = document.getElementById("cart-usd");
        const cartBs = document.getElementById("cart-bs");
        const drawerUsd = document.getElementById("drawer-total-usd");
        const drawerBs = document.getElementById("drawer-total-bs");
        const waLink = document.getElementById("wa-checkout-link");

        const items = Object.values(carrito);
        const totalItems = items.reduce((acc, cur) => acc + cur.cantidad, 0);

        if (totalItems === 0) {
            bar.classList.remove("active");
            cerrarDrawer();
            return;
        }

        const totalUSD = items.reduce((acc, cur) => acc + (cur.precioUSD * cur.cantidad), 0);
        const totalBs = totalUSD * tasaOficial;

        countEl.textContent = `${totalItems} ${totalItems === 1 ? 'ítem' : 'ítems'}`;
        cartUsd.textContent = `$${totalUSD.toFixed(2)}`;
        cartBs.textContent = `(${totalBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Bs)`;
        
        drawerUsd.textContent = `$${totalUSD.toFixed(2)}`;
        drawerBs.textContent = `Bs. ${totalBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        list.innerHTML = "";
        let textoItemsWA = "";

        items.forEach(item => {
            textoItemsWA += `• ${item.cantidad}x ${item.nombre} ($${(item.precioUSD * item.cantidad).toFixed(2)})\n`;
            
            const row = document.createElement("div");
            row.className = "cart-item-row";
            row.innerHTML = `
                <div class="item-row-info">
                    <h4>${item.nombre}</h4>
                    <small>$${(item.precioUSD * item.cantidad).toFixed(2)}</small>
                </div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="modificarCantidad('${item.id}', -1)">-</button>
                    <span style="font-weight: 800; min-width: 18px; text-align: center;">${item.cantidad}</span>
                    <button class="qty-btn" onclick="modificarCantidad('${item.id}', 1)">+</button>
                </div>
            `;
            list.appendChild(row);
        });

        const mensaje = `🍔 *NUEVO PEDIDO - BURGER 55*\n` +
                        `Modalidad: *${tipoEntrega}*\n` +
                        `--------------------------------\n` +
                        `${textoItemsWA}` +
                        `--------------------------------\n` +
                        `*TOTAL A PAGAR:*\n` +
                        `💵 $${totalUSD.toFixed(2)}\n` +
                        `🇻🇪 Bs. ${totalBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\n` +
                        `_(Tasa BCV: ${tasaOficial.toFixed(2)} Bs/$)_\n\n` +
                        `Hola, quiero coordinar los datos de pago y entrega.`;

        waLink.href = `https://wa.me/${CONFIG.telefonoWA}?text=${encodeURIComponent(mensaje)}`;
        bar.classList.add("active");
    }

    function abrirDrawer() {
        document.getElementById("drawer-overlay").classList.add("active");
        document.body.style.overflow = "hidden";
    }

    function cerrarDrawer() {
        document.getElementById("drawer-overlay").classList.remove("active");
        document.body.style.overflow = "";
    }
</script>
</body>
</html>
